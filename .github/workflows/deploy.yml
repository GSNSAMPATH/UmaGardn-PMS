name: Build & Deploy PMS (GHCR → VPS)

on:
  push:
    branches:
      - main

# ✅ IMPORTANT
permissions:
  contents: read
  packages: write

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ✅ Login to GHCR using GitHub Actions token
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.VPS_USER }}
          password: ${{ github.token }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: ./HotelPMS-Backend
          file: ./HotelPMS-Backend/HotelPMS.API/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/Umagarden-api:latest

      - name: Build & push WEB image
        uses: docker/build-push-action@v6
        with:
          context: ./pms-frontend
          file: ./pms-frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/scenery-villas-web:latest

  deploy:
    needs: build_and_push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 30m
          script: |
            cd "/opt/pms/UMAGARDEN"
            docker compose pull
            docker compose up -d
            docker image prune -f
